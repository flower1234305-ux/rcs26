# The studio workspace: one environment and one lockfile for every project in
# projects/. compas_vol is pinned here, once, so everyone builds on the same
# release. To change it, see docs/maintaining.md.
[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
compas-vol = { git = "https://github.com/rccn-dev/compas_vol", tag = "v0.3.0" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "nbformat>=5",
    "nbclient>=0.10",
    "ipykernel>=6",
    "jupyterlab>=4",
    "nbstripout>=0.8",
    "pre-commit>=4; python_version >= '3.10'",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --import-mode=importlib --ignore-glob=*/grasshopper/*"
testpaths = ["tests", "projects"]
filterwarnings = [
    # scikit-image's marching cubes still assigns to ndarray.shape, which
    # NumPy 2.5 deprecates. Nothing we can act on from here.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
# Rhino 8 embeds Python 3.9, and workflows become Grasshopper components.
target-version = "py39"
extend-exclude = ["templates"]
builtins = ["ghenv"]

[tool.ruff.lint]
select = ["E", "W", "F", "NPY"]
