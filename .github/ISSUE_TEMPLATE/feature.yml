name: Feature
description: Something a workflow needs. Library features go in rccn-dev/compas_vol.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What it would let you design
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who else needs it
      description: If a second project needs it, it probably belongs in compas_vol.
